services:
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AGENT_BACKEND: ${DOCKER_AGENT_BACKEND:-graph}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      STT_PROVIDER: ${DOCKER_STT_PROVIDER:-cloud}
      TTS_PROVIDER: ${DOCKER_TTS_PROVIDER:-cloud}
      TTS_CLOUD_PROVIDER: ${DOCKER_TTS_CLOUD_PROVIDER:-edge}
      VAD_PROVIDER: ${DOCKER_VAD_PROVIDER:-energy}
    volumes:
      - ./logs:/app/logs
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
