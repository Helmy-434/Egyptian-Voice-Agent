[project]
name = "egyptian-voice-agent"
version = "0.1.0"
description = "Egyptian Arabic Voice Agent"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-genai",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph",
]

authors = [
    {name = "Abdelrahman Gaber", email = "abdelrahman.gaber.hamdy@gmail.com"},
    {name = "Yousef Helmy", email = "youssefhelmy1113@gmail.com"}
]

[project.optional-dependencies]
gpu = [
    "numpy>=1.26",
    "silero-vad>=5.1.2",
    "sounddevice>=0.5",
]
eval = [
    "edge-tts",
    "librosa",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -m 'not live'"
markers = ["live: needs real API keys or a GPU (skipped by default)"]