[project]
name = "egyptian-voice-agent"
version = "0.1.0"
description = "Egyptian Arabic Voice Agent"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

authors = [
    {name = "Abdelrahman Gaber", email = "abdelrahman.gaber.hamdy@gmail.com"},
    {name = "Yousef Helmy", email = "youssefhelmy1113@gmail.com"}
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"